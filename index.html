<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLANT-X — Botanical Research &amp; Early-Warning Platform</title>
    <meta name="description" content="AI botanical research dashboard predicting plant stress before visible symptoms appear via sensor telemetry and vision intelligence." />
    <meta property="og:title" content="PLANT-X — Botanical Research &amp; Early-Warning Platform" />
    <meta property="og:description" content="AI botanical research dashboard predicting plant stress before visible symptoms appear via sensor telemetry and vision intelligence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- GitHub Pages Subpath & Trailing Slash Guard: Prevents blank screen when visiting https://user.github.io/repo without trailing slash -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.history.replaceState(null, '', path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050e09] text-emerald-50 antialiased selection:bg-emerald-500 selection:text-black min-h-screen">
    <!-- Immediate Zero-Blank-Screen Botanical Loader -->
    <!-- This renders immediately on initial HTML download and is smoothly replaced when React mounts -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050e09; color: #10b981; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(16, 185, 129, 0.15); border: 1.5px solid #10b981; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #34d399; margin-bottom: 20px; box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);">
          PX
        </div>
        <h1 style="color: #ffffff; font-size: 20px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: 0.05em;">
          PLANT-X BOTANICAL RESEARCH
        </h1>
        <p style="color: #6ee7b7; font-size: 13px; margin: 0 0 24px 0; max-width: 420px; line-height: 1.5;">
          Initializing AI early-warning stress telemetry &amp; vision models...
        </p>
        <div style="width: 180px; height: 4px; background: rgba(16, 185, 129, 0.2); border-radius: 4px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: #10b981; border-radius: 4px; animation: px-load 1.4s ease-in-out infinite;"></div>
        </div>
        <noscript>
          <p style="color: #f87171; margin-top: 20px; font-size: 13px;">
            JavaScript is required to run the PLANT-X Botanical Dashboard. Please enable JavaScript in your browser.
          </p>
        </noscript>
      </div>
      <style>
        @keyframes px-load {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
