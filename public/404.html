<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLANT-X — Redirecting</title>
    <!-- GitHub Pages SPA Redirector: routes 404s back to index.html with path preserved -->
    <script>
      var path = window.location.pathname;
      // Get the repo name if hosted on github.io (e.g. /my-repo/some-page -> /my-repo/)
      var pathSegments = path.split('/').filter(Boolean);
      var repoSegment = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      
      // Redirect to repo root with full path in hash or query
      window.location.replace(window.location.origin + repoSegment);
    </script>
  </head>
  <body style="background-color: #050e09; color: #10b981; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 16px; font-weight: 600;">Redirecting to PLANT-X Botanical Dashboard...</p>
      <a href="./" style="color: #34d399; text-decoration: underline; font-size: 13px;">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
